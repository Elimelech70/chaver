[project]
name = "chaver"
version = "0.2.0"
description = "Chaver — a Claude-shaped companion agent on the Catalyst cognitive architecture"
requires-python = ">=3.11"
authors = [
    { name = "Craig" },
]
dependencies = [
    "anthropic>=0.40.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chaver*"]
